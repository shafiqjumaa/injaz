<style>

.w{max-width:1080px;margin:auto;padding:0 18px}

.hd{text-align:center;padding:36px 0 30px}

.g.l{background:#fff;color:#0d1240}
.big{font-size:34px;font-weight:800;line-height:1.1}
.sm{font-size:13px;opacity:.75}

.c.a{background:#1a22c8;color:#fff;border-color:#1a22c8}

.it .ic{font-size:24px}.it .t{flex:1;min-width:0}.it .t b{display:block;overflow-wrap:anywhere}.it .t span{color:var(--mu);font-size:13px}

</head>

</section>

<section class="sec" style="padding-top:0">

<div class="tabs" id="tabs"></div>
<div id="list"></div>

<div class="c"><b data-i="goal"></b><br><br><input type="number" id="gl" min="1" max="20"><br><br><small data-i="mgl"></small><input type="number" id="mg" min="1"><br><br><small data-i="ygl"></small><input type="number" id="yg" min="1"><br><br>

</div>
</section>
</main>
<main class="w" id="lib"><section class="sec"><h2 data-i="tbl"></h2><p class="sub" data-i="tbs"></p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><input id="q" data-p="srch" style="flex:1;min-width:160px"><select id="tf" style="width:auto"></select><button class="pill" style="color:var(--tx);border-color:var(--ln)" id="csv" data-i="csv"></button></div><div style="overflow-x:auto"><table id="tbl"></table></div></section></main>
<footer data-i="foot"></footer>
